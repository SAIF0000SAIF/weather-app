
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <style>

        /* Reset */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        /* Body */

        body {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #101b35, #1b3152, #0c172b);
        }

        /* Main Card */

        .weather-card {
            width: 420px;
            max-width: 100%;
            padding: 35px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            color: white;
        }

        /* Heading */

        .weather-card h1 {
            font-size: 32px;
            margin-bottom: 25px;
            font-weight: 700;
        }

        /* Search Box */

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        .inp {
            width: 100%;
            min-width: 0;
            height: 55px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            outline: none;
            border-radius: 12px;
            padding: 0px 15px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .inp::placeholder {
            color: #a9bad5;
        }

        .inp:focus {
            border-color: #38bdf8;
        }

        /* Search Button */

        .search-btn {
            width: 100px;
            height: 55px;
            flex-shrink: 0;
            border: none;
            border-radius: 12px;
            background: #38bdf8;
            color: #101b35;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-btn:hover {
            background: #7dd3fc;
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Weather Information */

        #weather1_box {
            margin-top: 15px;
        }

        #weather1_box h2 {
            margin: 12px 0px;
            font-size: 18px;
            font-weight: 500;
            color: #e3efff;
        }

        .loading {
            font-size: 16px;
            color: #38bdf8;
        }

        .error {
            color: #ff8f8f;
        }

        /* Tablet */

        @media (max-width: 768px) {

            body {
                padding: 25px;
            }

            .weather-card {
                width: 550px;
                padding: 30px;
            }

            .weather-card h1 {
                font-size: 29px;
            }

            .inp {
                height: 52px;
                font-size: 15px;
            }

            .search-btn {
                height: 52px;
                width: 100px;
            }

            #weather1_box h2 {
                font-size: 17px;
            }

        }

        /* Mobile */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .weather-card {
                width: 100%;
                padding: 22px;
                border-radius: 20px;
            }

            .weather-card h1 {
                font-size: 25px;
                margin-bottom: 22px;
            }

            .search-box {
                gap: 7px;
            }

            .inp {
                height: 48px;
                padding: 0px 10px;
                font-size: 14px;
            }

            .search-btn {
                width: 85px;
                height: 48px;
                font-size: 13px;
            }

            #weather1_box {
                margin-top: 12px;
            }

            #weather1_box h2 {
                font-size: 15px;
                margin: 12px 0px;
            }

        }

        /* Small Mobile */

        @media (max-width: 350px) {

            .weather-card {
                padding: 16px;
            }

            .weather-card h1 {
                font-size: 22px;
            }

            .search-btn {
                width: 72px;
                font-size: 12px;
            }

            .inp {
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

    <div class="weather-card">

        <h1>🌤 Weather App</h1>

        <div class="search-box">

            <input
                id="input"
                class="inp"
                type="text"
                placeholder="Enter city name"
            >

            <button class="search-btn" id="searchBtn">
                Search
            </button>

        </div>

        <div id="weather1_box"></div>

    </div>


    <script>

        const inp_box = document.querySelector("#input");

        const weather1 = document.querySelector("#weather1_box");

        const searchBtn = document.querySelector("#searchBtn");


        // Weather Search Function

        async function getWeather() {

            const city = inp_box.value.trim();

            if (!city) {

                weather1.innerHTML = `
                    <h2 class="error">Please enter a city name</h2>
                `;

                return;

            }

            searchBtn.disabled = true;

            weather1.innerHTML = `
                <p class="loading">Loading...</p>
            `;

            const API =
                `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=21805bff7224936fa25d6cec016a0a4b&units=metric`;

            try {

                const response = await fetch(API);

                const data = await response.json();

                if (!response.ok) {

                    if (response.status === 404) {
                        throw new Error("City not found");
                    }

                    throw new Error("Something went wrong");

                }

                weather1.innerHTML = `

                    <h2>📍 ${data.name}</h2>

                    <h2>🌡 ${data.main.temp}°C</h2>

                    <h2>☁ ${data.weather[0].main}</h2>

                    <h2>💧 Humidity: ${data.main.humidity}%</h2>

                    <h2>🌬 Wind: ${data.wind.speed} m/s</h2>

                `;

            }

            catch (error) {

                weather1.innerHTML = `
                    <h2 class="error">${error.message}</h2>
                `;

            }

            finally {

                searchBtn.disabled = false;

            }

        }


        // Button Click

        searchBtn.addEventListener("click", getWeather);


        // Enter Key

        inp_box.addEventListener("keydown", function(e) {

            if (e.key === "Enter") {
                getWeather();
            }

        });

    </script>

</body>

</html>
