<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background: linear-gradient(135deg,
                    #00c6ff,
                    #0072ff);

        }

        .weather-card {
            width: 100%;
            max-width: 420px;

            padding: 30px;

            border-radius: 24px;

            background: rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);

            text-align: center;
            color: white;

        }

        .weather-card h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .inp {
            width: 100%;
            height: 55px;

            border: none;
            outline: none;

            border-radius: 12px;

            padding: 0 15px;

            font-size: 1rem;

            margin-bottom: 20px;

        }

        .inp::placeholder {
            color: #777;
        }

        #weather1_box {
            margin-top: 15px;
        }

        #weather1_box h2 {
            margin: 12px 0;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .loading {
            font-size: 1rem;
        }

        .error {
            color: #ffd6d6;
        }

        /* Tablet */

        @media (max-width: 768px) {

            .weather-card {
                max-width: 500px;
                padding: 25px;
            }

            .weather-card h1 {
                font-size: 1.8rem;
            }

            #weather1_box h2 {
                font-size: 1rem;
            }


        }

        /* Mobile */

        @media (max-width: 576px) {

            body {
                padding: 15px;
            }

            .weather-card {
                max-width: 100%;
                padding: 20px;
                border-radius: 20px;
            }

            .weather-card h1 {
                font-size: 1.6rem;
            }

            .inp {
                height: 50px;
                font-size: 0.95rem;
            }

            #weather1_box h2 {
                font-size: 0.95rem;
                margin: 10px 0;
            }


        }
    </style>


</head>

<body>
    <div class="weather-card">

        <h1>🌤 Weather App</h1>

        <input id="input" class="inp" type="text" placeholder="Enter city name">

        <div id="weather1_box"></div>

    </div>
    <script>

        const inp_box =
            document.querySelector("#input");

        const weather1 =
            document.querySelector("#weather1_box");

        inp_box.addEventListener(
            "keyup",
            async function (e) {

                if (e.key === "Enter") {

                    e.target.disabled = true;

                    weather1.innerHTML =
                        `<p class="loading">Loading...</p>`;

                    const city =
                        inp_box.value.trim();

                    const API =
                        `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=21805bff7224936fa25d6cec016a0a4b&units=metric`;

                    try {

                        const response =
                            await fetch(API);

                        const data =
                            await response.json();

                        e.target.disabled = false;

                        if (
                            response.status === 404 ||
                            data.cod === "404"
                        ) {

                            weather1.innerHTML = `
                            <h2 class="error">
                                City not found
                            </h2>
                        `;

                        } else {

                            weather1.innerHTML = `
                            <h2>
                                📍 ${data.name}
                            </h2>

                            <h2>
                                🌡 ${data.main.temp}°C
                            </h2>

                            <h2>
                                ☁ ${data.weather[0].main}
                            </h2>

                            <h2>
                                💧 Humidity:
                                ${data.main.humidity}%
                            </h2>

                            <h2>
                                🌬 Wind:
                                ${data.wind.speed} m/s
                            </h2>
                        `;
                        }

                    } catch (error) {

                        weather1.innerHTML = `
                        <h2 class="error">
                            Something went wrong
                        </h2>
                    `;

                    }

                    e.target.disabled = false;
                }
            }
        );

    </script>


</body>

</html>


</body>

</html>
